name: Preview on GitHub Pages

# A private-preview copy of the site at https://<user>.github.io/<repo>/.
# It is marked noindex so it never competes with mkaluplast.com in Google.
# The contact form and CMS login need PHP, so they only work on Namecheap.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_NOINDEX: 'true'

      # Project sites live under /<repo>/, so prefix every root-relative link.
      - run: node scripts/rebase-dist.mjs "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
